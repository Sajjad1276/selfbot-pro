services:
  - type: worker
    name: selfbot-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: TIMEZONE
        value: Asia/Tehran
      - key: DEFAULT_LANG
        value: fa
      - key: BOT_PREFIX
        value: .
      - key: DATABASE_PATH
        value: /tmp/selfbot.db
      - key: SESSION_DIRECTORY
        value: /tmp/sessions
      - key: LOG_DIRECTORY
        value: /tmp/logs
      - key: PYTHONUNBUFFERED
        value: "1"
